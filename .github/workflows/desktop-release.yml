name: Desktop release (Linux)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          version="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag desktop-v$tag does not match packages/desktop/package.json ($version)" >&2
            exit 1
          fi

      - name: Build the .deb
        run: bun run --filter @cloudagents/desktop dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            packages/desktop/release/*.deb
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 ||
            gh release create desktop-latest \
              --title "Kestrel Desktop (latest)" \
              --notes "Download the latest Kestrel desktop build. The desktop app updates itself from this release."
          gh release upload desktop-latest artifacts/* --clobber

      - name: List published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view desktop-latest --json assets --jq '.assets[].name'

name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require public server URL
        env:
          SERVER_URL: ${{ vars.VITE_CLOUDAGENTS_SERVER }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::repo variable VITE_CLOUDAGENTS_SERVER is not set; the web build would call localhost"
            exit 1
          fi

      - name: Build web
        working-directory: packages/web
        env:
          VITE_CLOUDAGENTS_SERVER: ${{ vars.VITE_CLOUDAGENTS_SERVER }}
        run: bunx vite build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: packages/web

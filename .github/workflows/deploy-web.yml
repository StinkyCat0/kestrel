name: deploy-web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require public server URL
        env:
          SERVER_URL: ${{ vars.VITE_CLOUDAGENTS_SERVER }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::repo variable VITE_CLOUDAGENTS_SERVER is not set; the web build would call localhost"
            exit 1
          fi

      - name: Build with cf
        working-directory: packages/web
        env:
          VITE_CLOUDAGENTS_SERVER: ${{ vars.VITE_CLOUDAGENTS_SERVER }}
        run: bunx cf build

      - name: Dry-run deploy
        working-directory: packages/web
        run: bunx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx cf deploy --prebuilt --mode production
